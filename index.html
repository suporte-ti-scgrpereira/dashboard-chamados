<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Dashboard de Teste</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 8px;
        }
        p {
            color: #666;
            margin-bottom: 24px;
        }
        .chart-box {
            position: relative;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Dashboard de Chamados</h1>
        <p>Status da integração: <strong>Online / Funcionando</strong></p>

        <div class="chart-box">
            <canvas id="meuGrafico"></canvas>
        </div>
    </div>

    <script>
        // Configuração e criação do gráfico de teste
        const ctx = document.getElementById('meuGrafico').getContext('2d');
        new Chart(ctx, {
            type: 'bar', // Tipo: barra, linha (line), pizza (pie)
            data: {
                labels: ['Novo', 'Em Atendimento', 'Concluído'],
                datasets: [{
                    label: 'Quantidade de Chamados',
                    data: [12, 19, 7], // Dados fictícios para teste
                    backgroundColor: [
                        '#3b82f6',
                        '#f59e0b',
                        '#10b981'
                    ],
                    borderRadius: 6
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    </script>

</body>
</html>
