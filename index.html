<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal de Chamados</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #121214; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            color: #e1e1e6;
            background-image: url('logo-empresa.png'); 
            background-repeat: no-repeat;
            background-position: center;
            background-size: 350px auto;
        }
    
        .login-card { 
            background: rgba(30, 30, 36, 0.94); 
            padding: 40px; 
            border-radius: 10px; 
            border: 1px solid #2d2d35;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 380px; 
            text-align: center; 
            backdrop-filter: blur(5px);
        }
    
        .logo { max-width: 140px; margin-bottom: 20px; }
        
        .form-group { text-align: left; margin-bottom: 20px; }
        
        label { font-weight: 600; font-size: 14px; color: #a8a8b3; display: block; margin-bottom: 8px; }
        
        input[type="text"], input[type="password"] { 
            width: 100%; 
            padding: 12px; 
            background-color: #121214; 
            border: 1px solid #323238; 
            color: #ffffff; 
            border-radius: 6px; 
            font-size: 15px; 
        }
        
        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #00b37e;
            outline: none;
        }
    
        button { 
            width: 100%; 
            padding: 12px; 
            background-color: #00b37e; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.2s; 
        }
        button:hover { background-color: #00875f; }
    
        #mensagem-erro { color: #f87171; font-size: 14px; margin-top: 15px; font-weight: 600; }
    
        /* Pop-up Modal */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0; top: 0; 
            width: 100%; height: 100%; 
            background-color: rgba(0,0,0,0.75); 
            justify-content: center; 
            align-items: center;
            backdrop-filter: blur(3px);
        }
        
        .modal-content {
            background-color: #202024; 
            color: #e1e1e6;
            padding: 25px; 
            border: 1px solid #2d2d35;
            border-radius: 8px; 
            width: 90%; 
            max-width: 400px; 
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="logo.png" alt="Logo Empresa" class="logo">
        <h2>Acesso ao Portal</h2>
        
        <form id="form-login">
            <div class="form-group">
                <label for="matricula">Matrícula</label>
                <input type="text" id="matricula" placeholder="Digite os 8 dígitos da matrícula" maxlength="8" inputmode="numeric" required autocomplete="off">
            </div>
            <button type="submit" id="btn-entrar">Entrar</button>
        </form>

        <p id="mensagem-erro"></p>
    </div>

    <!-- Modal de Senha do TI (Dentro do Body) -->
    <div id="modalSenha" class="modal">
        <div class="modal-content">
            <h3 style="color: #004691; margin-bottom: 15px;">Autenticação TI/CPD</h3>
            <p style="font-size: 14px; color: #666; margin-bottom: 15px;">Digite a sua senha de acesso:</p>
            <input type="password" id="senhaTI" placeholder="Sua senha">
            <button onclick="confirmarSenhaTI()" style="margin-top: 15px; background-color: #004691;">Confirmar</button>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyszNaEjUlKHdS6sM_2tejIU2LSi4e6uFUWeq4-uTGXIFKHogKaAzrmgpffx8fqoZjX/exec';

        const formLogin = document.getElementById('form-login');
        const btnEntrar = document.getElementById('btn-entrar');
        const msgErro = document.getElementById('mensagem-erro');
        let matriculaGuardada = "";

        formLogin.addEventListener('submit', (e) => {
            e.preventDefault();
            const matricula = document.getElementById('matricula').value.trim();

            const apenasNumeros8Digitos = /^\d{8}$/;
            if (!apenasNumeros8Digitos.test(matricula)) {
                msgErro.innerText = 'A matrícula deve conter exatamente 8 números!';
                return;
            }

            matriculaGuardada = matricula;
            fazerLogin(matricula, "");
        });

        async function fazerLogin(matricula, senha) {
            msgErro.innerText = '';
            btnEntrar.innerText = 'Verificando...';
            btnEntrar.disabled = true;

            try {
                let url = `${API_URL}?matricula=${encodeURIComponent(matricula)}`;
                if (senha) {
                    url += `&senha=${encodeURIComponent(senha)}`;
                }

                const response = await fetch(url);
                const resultado = await response.json();

                // Caso precise de senha
                if (resultado.status === 'requer_senha') {
                    btnEntrar.innerText = 'Entrar';
                    btnEntrar.disabled = false;
                    document.getElementById('modalSenha').style.display = 'flex';
                    document.getElementById('senhaTI').focus();
                } 
                // Sucesso
                else if (resultado.status === 'sucesso') {
                    sessionStorage.setItem('usuarioLogado', JSON.stringify(resultado.usuario));
                    
                    const cargo = resultado.usuario.cargo.toString().toUpperCase().replace(/\./g, '').trim();

                    if (cargo === 'TI' || cargo === 'CPD') {
                        window.location.href = 'receptador.html';
                    } else {
                        window.location.href = 'solicitar.html';
                    }
                } 
                // Matrícula não existe
                else if (resultado.status === 'nao_encontrado') {
                    window.location.href = `cadastro.html?matricula=${encodeURIComponent(matricula)}`;
                } 
                // Senha errada ou erro de validação
                else {
                    msgErro.innerText = resultado.mensagem;
                    btnEntrar.innerText = 'Entrar';
                    btnEntrar.disabled = false;
                }
            } catch (erro) {
                msgErro.innerText = 'Erro ao conectar com a base de dados.';
                btnEntrar.innerText = 'Entrar';
                btnEntrar.disabled = false;
            }
        }

        function confirmarSenhaTI() {
            const senha = document.getElementById('senhaTI').value.trim();
            if (!senha) {
                alert('Digite sua senha!');
                return;
            }
            document.getElementById('modalSenha').style.display = 'none';
            fazerLogin(matriculaGuardada, senha);
        }
    </script>

</body>
</html>
